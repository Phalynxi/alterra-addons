plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.148' }
version = '1.0.1'
base { archivesName = 'alterra_farmersdelight' }
tasks.withType(Jar).configureEach { archiveVersion = '' }   // the jar is named alterra_farmersdelight.jar; the version lives in neoforge.mods.toml
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
dependencies { compileOnly project(':api') }
neoForge {
    version = neo_version
    mods { alterra_farmersdelight { sourceSet sourceSets.main } }
}
processResources {
    inputs.property 'v', project.version
    filesMatching('META-INF/neoforge.mods.toml') { filter { line -> line.replace('@VERSION@', project.version.toString()) } }
}
repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }
dependencies { compileOnly "maven.modrinth:farmers-delight:1.21.1-1.3.4" }
