plugins { id 'java' }
version = '1.0.0'
base { archivesName = 'alterra_aeronautics' }
tasks.withType(Jar).configureEach { archiveVersion = '' }   // a data-only addon: the jar holds just recipes and tags
processResources {
    inputs.property 'v', project.version
    filesMatching('META-INF/neoforge.mods.toml') { filter { line -> line.replace('@VERSION@', project.version.toString()) } }
}
