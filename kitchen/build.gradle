plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.148' }
version = '1.0.3'
base { archivesName = 'alterra_kitchen' }
tasks.withType(Jar).configureEach { archiveVersion = '' }   // the jar is named alterra_kitchen.jar; the version lives in neoforge.mods.toml
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots/' }
}
dependencies {
    compileOnly project(':api')
    // Create is only needed to compile the powered ice cream machine (its classes load only when Create is installed)
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-218:slim') { transitive = false }
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.87+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.7'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.70.0.469'   // only to hide the secret recipes; JEI itself is optional
}
neoForge {
    version = neo_version
    mods { alterra_kitchen { sourceSet sourceSets.main } }
}
processResources {
    inputs.property 'v', project.version
    filesMatching('META-INF/neoforge.mods.toml') { filter { line -> line.replace('@VERSION@', project.version.toString()) } }
}
