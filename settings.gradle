pluginManagement { repositories { gradlePluginPortal(); maven { url = 'https://maven.neoforged.net/releases' } } }
rootProject.name = 'alterra-addons'
// api: the small public API of Alterra (compile-time only; the real classes come with the Alterra mod)
// kitchen, weather, music, farmersdelight: addons with code. create, aeronautics: data-only addons.
include 'api', 'kitchen', 'weather', 'music', 'farmersdelight', 'create', 'aeronautics'
