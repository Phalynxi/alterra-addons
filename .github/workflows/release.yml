# Push a tag like v1.0.0: builds every addon, publishes the jars as a release, and updates addons.json (versions, links, SHA-256).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/checkout@v4
        with: { repository: Phalynxi/prism-lib, path: prism-lib }
      - name: Prism Lib (the addons compile against it)
        run: cd prism-lib && chmod +x gradlew && ./gradlew publishToMavenLocal
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          python3 tools/release.py "$GITHUB_REF_NAME" --publish
      - name: Update the list
        run: |
          cp addons.json /tmp/addons.json
          git fetch origin main && git checkout -f main
          cp /tmp/addons.json addons.json
          git config user.name "${{ github.actor }}"; git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add addons.json && git commit -m "Release $GITHUB_REF_NAME" && git push
