name: Check the addon list
on:
  pull_request:
    paths: ['addons.json']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/validate_index.py addons.json --download
